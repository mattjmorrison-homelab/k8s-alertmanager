apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-discord
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: alertmanager-discord
    creationPolicy: Owner
  data:
    - secretKey: DISCORD_WEBHOOK_URL
      remoteRef:
        key: homelab/k8s-alertmanager/discord-webhook-url
        property: value
    - secretKey: DOWNTIME_WEBHOOK_URL
      remoteRef:
        key: homelab/k8s-alertmanager/downtime-webhook-url
        property: value
