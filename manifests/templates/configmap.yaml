apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: discord
      group_by: ['alertname', 'instance']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: discord-downtime
          matchers:
            - alertname = "PiNodeExporterDown"

    receivers:
      - name: discord
        webhook_configs:
          - url: 'http://alertmanager-discord-proxy.monitoring.svc:9094'
            send_resolved: true
      - name: discord-downtime
        webhook_configs:
          - url: 'http://alertmanager-discord-downtime-proxy.monitoring.svc:9094'
            send_resolved: true
