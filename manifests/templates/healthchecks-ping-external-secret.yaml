apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: healthchecks-ping
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: healthchecks-ping
    creationPolicy: Owner
  data:
    - secretKey: PING_URL
      remoteRef:
        key: homelab/k8s-alertmanager/healthchecks-ping-url
        property: value
